<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.flaticon.com%2Ffree-icon%2Fweather_1779940&psig=AOvVaw00jJtOWi5OPahKADX3Yl77&ust=1760288009502000&source=images&cd=vfe&opi=89978449&ved=0CBIQjRxqFwoTCJCKhP7NnJADFQAAAAAdAAAAABAEWeather App </title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // Firestore imports are not needed for this app but are included to satisfy environment requirements
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let auth, db;
        
        // Function to handle the actual weather search using Gemini API
        window.searchWeather = async (city) => {
            const display = document.getElementById('weather-display');
            const searchInput = document.getElementById('search-input');
            const loading = document.getElementById('loading-indicator');
            const citationsDiv = document.getElementById('citations');
            
            citationsDiv.innerHTML = '';
            
            // Handle the simulated MERNSTARK data
            if (city === 'Weather (Simulated)') {
                display.innerHTML = generateSimulatedWeather(city);
                searchInput.value = '';
                return;
            }

            loading.classList.remove('hidden');
            display.classList.add('hidden');

            // --- LLM API Setup for Grounded Search ---

            // Use the most effective prompt to get concise, structured data
            const userQuery = `What is the current temperature in Celsius, the humidity percentage, and the brief weather condition for ${city}? Output ONLY the following three pieces of information, each on a new line, and use standard units: [Temperature with units], [Weather Condition], [Humidity Percentage]. Do not include any other text or markdown. If data cannot be found, output: Data not available.`;
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                // Enable Google Search grounding tool
                tools: [{ "google_search": {} }],
            };

            const maxRetries = 5;
            let attempt = 0;
            
            while (attempt < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    let weatherText = "Weather data unavailable.";
                    let sources = [];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        weatherText = candidate.content.parts[0].text.trim();
                        
                        // Extract grounding sources
                        const groundingMetadata = candidate.groundingMetadata;
                        if (groundingMetadata && groundingMetadata.groundingAttributions) {
                            sources = groundingMetadata.groundingAttributions
                                .map(attribution => ({
                                    uri: attribution.web?.uri,
                                    title: attribution.web?.title,
                                }))
                                .filter(source => source.uri && source.title);
                        }
                    }

                    display.innerHTML = processWeatherResponse(city, weatherText);
                    displayCitations(sources);
                    
                    // Break the loop on success
                    break; 

                } catch (error) {
                    console.error("Gemini API call failed:", error);
                    attempt++;
                    if (attempt < maxRetries) {
                        const delay = Math.pow(2, attempt) * 1000; // Exponential backoff: 2s, 4s, 8s, ...
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        display.innerHTML = processWeatherResponse(city, "Data not available.\nCheck your internet connection or try a different city.");
                        displayCitations([]);
                    }
                }
            }
            
            loading.classList.add('hidden');
            display.classList.remove('hidden');
        };

        // Helper function to process the raw text output from the LLM
        function processWeatherResponse(city, text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            if (text.includes("Data not available") || lines.length < 3) {
                return `
                    <h2 class="text-6xl font-extrabold text-red-400 mb-4">${city}</h2>
                    <p class="text-xl text-gray-300">Weather data for this location could not be fetched.</p>
                    <p class="text-lg text-gray-500 mt-2">Please try a different city name.</p>
                `;
            }
            
            const [temp, condition, humidity] = lines;
            const icon = getWeatherIcon(condition);

            return `
                <h2 class="text-6xl font-extrabold text-white mb-4">${city}</h2>
                <div class="flex items-center justify-center space-x-8 my-8">
                    <span class="text-9xl ${icon.color}">${icon.emoji}</span>
                    <span id="temperature" class="text-[120px] font-light text-white leading-none">${temp}</span>
                </div>
                <div class="text-center">
                    <p class="text-3xl font-semibold text-sky-300 mb-4">${condition}</p>
                    <div class="flex justify-center space-x-8 text-xl text-gray-300">
                        <span>Humidity: <span class="font-bold">${humidity}</span></span>
                    </div>
                </div>
            `;
        }
        
        // Helper function to display citations
        function displayCitations(sources) {
            const citationsDiv = document.getElementById('citations');
            if (sources.length > 0) {
                let html = '<p class="text-sm font-semibold mb-2">Sources:</p><ul class="space-y-1">';
                sources.forEach(source => {
                    html += `<li class="text-xs text-gray-400 truncate hover:text-sky-300">
                        <a href="${source.uri}" target="_blank" rel="noopener noreferrer" title="${source.title}">${source.title || source.uri}</a>
                    </li>`;
                });
                html += '</ul>';
                citationsDiv.innerHTML = html;
            }
        }
        
        // Simulated weather for the default Weather location
        function generateSimulatedWeather(city) {
            const temp = '0°C';
            const condition = 'Optimizing Code Climate';
            const humidity = '20%';
            const icon = getWeatherIcon(condition);
            
            return `
                <h2 class="text-6xl font-extrabold text-white mb-4">${city}</h2>
                <div class="flex items-center justify-center space-x-8 my-8">
                    <span class="text-9xl ${icon.color}">${icon.emoji}</span>
                    <span id="temperature" class="text-[120px] font-light text-white leading-none">${temp}</span>
                </div>
                <div class="text-center">
                    <p class="text-3xl font-semibold text-sky-300 mb-4">${condition}</p>
                    <div class="flex justify-center space-x-8 text-xl text-gray-300">
                        <span>Framework Stability: <span class="font-bold">${humidity}</span></span>
                    </div>
                </div>
            `;
        }

        function getWeatherIcon(condition) {
            const lowerCondition = condition.toLowerCase();
            if (lowerCondition.includes('sunny') || lowerCondition.includes('clear')) {
                return { emoji: '☀️', color: 'text-yellow-400' };
            } else if (lowerCondition.includes('cloud') || lowerCondition.includes('overcast')) {
                return { emoji: '☁️', color: 'text-gray-400' };
            } else if (lowerCondition.includes('rain') || lowerCondition.includes('drizzle')) {
                return { emoji: '🌧️', color: 'text-indigo-400' };
            } else if (lowerCondition.includes('snow') || lowerCondition.includes('ice')) {
                return { emoji: '❄️', color: 'text-blue-200' };
            } else if (lowerCondition.includes('storm') || lowerCondition.includes('thunder')) {
                return { emoji: '⛈️', color: 'text-purple-400' };
            } else if (lowerCondition.includes('mist') || lowerCondition.includes('fog')) {
                return { emoji: '🌫️', color: 'text-gray-500' };
            } else if (lowerCondition.includes('optimizing code')) {
                 return { emoji: '💻', color: 'text-green-400' };
            } else {
                return { emoji: '🌡️', color: 'text-white' };
            }
        }

        function handleSearchSubmit(event) {
            event.preventDefault();
            const city = document.getElementById('search-input').value.trim();
            if (city) {
                window.searchWeather(city);
            }
        }

        // --- Firebase Initialization and Auth ---
        window.onload = () => {
             // Attach event listener to the form
            document.getElementById('search-form').addEventListener('submit', handleSearchSubmit);
            
            // Set initial state to Weather App
            window.searchWeather('WEATHER (RESULT)');

            if (Object.keys(firebaseConfig).length > 0) {
                try {
                    setLogLevel('Debug');
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    // Ensure user is signed in (anonymously or via token)
                    onAuthStateChanged(auth, async (user) => {
                        if (!user) {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } else {
                                await signInAnonymously(auth);
                            }
                        }
                    });
                } catch (e) {
                    console.error("Firebase Initialization Failed:", e);
                }
            } else {
                console.warn("Firebase config not found. Running demo in full offline mode.");
            }
        };

    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f2937, #0f172a); /* Dark blue/slate gradient */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            backdrop-filter: blur(15px);
            background: rgba(30, 41, 59, 0.7); /* Slightly translucent dark background */
            border: 1px solid rgba(71, 85, 105, 0.5); /* Subtle border */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(125, 211, 252, 0.8), 0 0 20px rgba(3, 105, 161, 0.5);
        }
        .search-input-focus:focus {
            box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.5); /* Custom focus ring for icy effect */
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 5s linear infinite;
        }
    </style>
</head>
<body>

    <div class="card w-full max-w-lg p-8 rounded-2xl text-center">

        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-widest glow-text">Weather App</h1>
            <p class="text-sm text-gray-400 mt-1">Weather Report</p>
        </header>

        <!-- Search Form -->
        <form id="search-form" class="flex mb-10 shadow-lg rounded-xl overflow-hidden">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Enter city name (e.g., London, Tokyo)" 
                required
                class="flex-grow p-4 text-gray-900 bg-white border-none outline-none search-input-focus"
            >
            <button 
                type="submit" 
                class="px-6 bg-sky-600 text-white font-semibold hover:bg-sky-700 transition duration-300 rounded-r-xl"
            >
                Search
            </button>
        </form>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden flex flex-col items-center justify-center p-12">
            <svg class="animate-spin-slow h-10 w-10 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-4 text-sky-400">Fetching Real-Time Data...</p>
        </div>

        <!-- Weather Display Card -->
        <div id="weather-display" class="transition-opacity duration-500">
            <!-- Content populated by JavaScript -->
        </div>
        
        <!-- Citations Area -->
        <div id="citations" class="text-left mt-8 p-4 bg-gray-800/50 rounded-lg text-gray-400">
            <!-- Citations will be added here -->
        </div>

    </div>

</body>
</html>
